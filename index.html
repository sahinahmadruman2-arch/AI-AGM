
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#09090f">

  <meta name="description"
    content="AGM AI - Your personal AI workspace.">

  <meta name="mobile-web-app-capable" content="yes">

  <title>AGM AI — Your AI Workspace</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect"
    href="https://cdn.jsdelivr.net">

  <link rel="preconnect"
    href="https://huggingface.co">

  <link rel="preconnect"
    href="https://fonts.googleapis.com">

</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

      <div class="brand">

        <div class="brand-icon">A</div>

        <span>AGM AI</span>

        <button
          class="close-sidebar"
          id="closeSidebar"
          aria-label="Close sidebar">
          ×
        </button>

      </div>

      <!-- NEW CHAT -->

      <button class="new-chat" id="newChat">

        <span>＋</span>
        New Chat

      </button>

      <!-- CHAT HISTORY -->

      <div class="history-title">
        RECENT CHATS
      </div>

      <div
        id="history"
        class="history">
      </div>

      <!-- PROFILE -->

      <div class="sidebar-bottom">

        <div class="profile-avatar">A</div>

        <div>
          <strong>AGM Studio</strong>
          <small>Personal AI Workspace</small>
        </div>

      </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main">

      <!-- TOPBAR -->

      <header class="topbar">

        <button
          id="menuBtn"
          class="icon-btn"
          aria-label="Open menu">
          ☰
        </button>

        <div class="mobile-brand">
          AGM <span>AI</span>
        </div>

        <button
          id="themeBtn"
          class="icon-btn"
          aria-label="Change theme">
          ☼
        </button>

      </header>


      <!-- CHAT AREA -->

      <section
        class="chat-area"
        id="chatArea">

        <!-- WELCOME SCREEN -->

        <div
          class="welcome"
          id="welcome">

          <div class="welcome-logo">
            A
          </div>

          <div class="greeting">
            WELCOME TO AGM AI
          </div>

          <h1>
            Where ideas
            <br>
            <span>become reality.</span>
          </h1>

          <p>
            Your personal AI workspace.
            What would you like to explore today?
          </p>

          <!-- SUGGESTIONS -->

          <div class="suggestions">

            <button
              data-prompt="Help me write something creative">

              ✦
              <span>Creative writing</span>

            </button>

            <button
              data-prompt="Help me learn programming">

              ⌘
              <span>Learn coding</span>

            </button>

            <button
              data-prompt="Give me some new ideas">

              ✧
              <span>Explore ideas</span>

            </button>

            <button
              data-prompt="Explain something interesting">

              ◈
              <span>Learn something</span>

            </button>

          </div>

        </div>


        <!-- CHAT MESSAGES -->

        <div
          class="messages"
          id="messages">
        </div>

      </section>


      <!-- MESSAGE COMPOSER -->

      <footer class="composer-area">

        <div class="composer">

          <textarea
            id="prompt"
            placeholder="Message AGM AI..."
            rows="1"
            aria-label="Message AGM AI">
          </textarea>

          <div class="composer-bottom">

            <!-- AI ENGINE STATUS -->

            <span class="model-label">
              ✦ Local AI · Not loaded
            </span>

            <!-- SEND BUTTON -->

            <button
              id="sendBtn"
              class="send-btn"
              aria-label="Send message">

              ↑

            </button>

          </div>

        </div>

        <p class="disclaimer">
          AGM AI can make mistakes.
          Verify important information.
        </p>

      </footer>

    </main>

  </div>


  <!-- MOBILE SIDEBAR OVERLAY -->

  <div
    id="overlay"
    class="overlay">
  </div>


  <!-- AGM AI JAVASCRIPT MODULE -->

  <script
    type="module"
    src="script.js">
  </script>

</body>
</html>
